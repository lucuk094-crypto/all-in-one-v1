<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a"><title>Share → Downloader</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="text-align:center; padding-top:80px;">
  <div class="cyber-card"><div class="result-body">
    <p class="blink-text" data-i18n="s.title">Membuka downloader...</p>
    <p id="shareErr" class="hidden" style="font-family:monospace;" data-i18n="s.none"></p>
  </div></div>
</div>
<script src="i18n.js"></script>
<script>
(function () {
  applyI18n();
  var q = new URLSearchParams(location.search);
  var blob = [q.get('url'), q.get('text'), q.get('title')].filter(Boolean).join('\n');
  var m = blob.match(/https?:\/\/[^\s"'<>]+/);
  if (m) location.replace('/?u=' + encodeURIComponent(m[0]));
  else document.getElementById('shareErr').classList.remove('hidden');
})();
</script>
</body>
</html>
