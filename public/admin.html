<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Van313 Ultra</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="brand-box"><div class="brand-icon">///</div><div class="brand-text" data-i18n="a.title">ADMIN</div></div>
  <div class="nav-actions">
    <button id="langBtn" class="nav-btn small" onclick="setLang(getLang()==='id'?'en':'id')">ID</button>
    <button id="themeBtn" class="nav-btn small" onclick="toggleTheme()">T</button>
    <a href="index.html" class="nav-btn" data-i18n="l.back">Beranda</a>
  </div>
</nav>
<div class="container docs-container">
  <div class="cyber-card"><div class="card-body">
    <div class="input-row">
      <input type="password" id="admKey" class="cyber-input" data-i18n-ph="a.key_ph" placeholder="Kunci admin...">
      <button class="mini-btn" onclick="loadStats()" data-i18n="a.login">Buka</button>
      <button class="mini-btn alt" onclick="loadStats(true)" data-i18n="a.refresh">Refresh</button>
    </div>
    <div style="margin-top:10px;"><button class="dl-btn" onclick="checkCookies()" data-i18n="a.cookies">Cek Cookies</button></div>
  </div></div>
  <div class="cyber-card"><div class="card-body">
    <div class="opt-meta" data-i18n="a.up_t">Upload cookies.txt (VPS saja)</div>
    <div class="input-row" style="margin-top:8px;">
      <input type="file" id="ckFile" accept=".txt" class="cyber-input">
      <select id="ckSlot" class="cyber-input" style="max-width:110px;">
        <option value="1">Slot 1</option><option value="2">Slot 2</option><option value="3">Slot 3</option><option value="4">Slot 4</option><option value="5">Slot 5</option>
      </select>
      <button class="mini-btn" onclick="uploadCookies()" data-i18n="a.up_btn">Upload</button>
    </div>
    <div class="opt-meta" id="ckUpRes" style="margin-top:8px;"></div>
  </div></div>
  <div id="admErr" class="cyber-card error-state hidden"><div class="error-body" id="admErrTxt"></div></div>
  <div id="admBody"></div>
</div>
<script src="i18n.js"></script>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUptime(sec){
  sec = +sec || 0;
  var d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if (d) return d+'d '+h+'h';
  if (h) return h+'h '+m+'m';
  if (m) return m+'m '+s+'s';
  return s+'s';
}
async function loadStats(){
  var box=document.getElementById('admBody'), err=document.getElementById('admErr');
  err.classList.add('hidden'); box.innerHTML='';
  var key=document.getElementById('admKey').value;
  if(!key){try{key=sessionStorage.getItem('admkey')||'';document.getElementById('admKey').value=key;}catch(e){}}
  if(!key) return;
  try{sessionStorage.setItem('admkey',key);}catch(e){}
  box.innerHTML='<div class="cyber-card"><div class="card-body"><div class="skel"><div class="skel-row skel-line"></div><div class="skel-row skel-line"></div></div></div></div>';
  try{
    var r=await fetch('/api/stats?key='+encodeURIComponent(key));
    var j=await r.json();
    if(!r.ok||!j.success) throw new Error(j.error||t('a.wrong'));
    var kv=function(o){return Object.keys(o||{}).map(function(k){return '<div class="opt-row"><span class="opt-meta">'+esc(k)+'</span><span class="q-badge">'+esc(o[k])+'</span></div>';}).join('')||'<div class="opt-meta">-</div>';};
    var rows=function(arr,fmt){return (arr||[]).map(fmt).join('')||'<div class="opt-meta">-</div>';};
    var okRate = j.total ? Math.round(100*j.ok/j.total)+'%' : '-';
    box.innerHTML=
    '<div class="stat-grid">'+
      '<div class="stat-card"><div class="stat-num">'+j.total+'</div><div class="stat-lbl">'+esc(t('a.total'))+'</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+okRate+'</div><div class="stat-lbl">OK ('+j.ok+'/'+j.err+')</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+fmtUptime(j.uptimeSec)+'</div><div class="stat-lbl">UPTIME</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+j.jobsActive+'</div><div class="stat-lbl">JOBS AKTIF</div></div>'+
    '</div>'+
    '<div class="cyber-card result-card adm-sec"><div class="result-header"><span>'+esc(t('a.byplat'))+'</span><span class="result-badge">'+esc(j.runtime||'')+'</span></div><div class="result-body">'+kv(j.byPlatform)+'</div></div>'+
    '<div class="cyber-card result-card adm-sec"><div class="result-header"><span>'+esc(t('a.byep'))+'</span></div><div class="result-body">'+kv(j.byEndpoint)+'</div></div>'+
    '<div class="cyber-card result-card adm-sec"><div class="result-header"><span>'+esc(t('a.jobs'))+'</span></div><div class="result-body"><div class="opt-meta">buat '+j.jobs.created+' • selesai '+j.jobs.done+' • gagal '+j.jobs.error+' • batal '+j.jobs.cancelled+' • redis '+(j.redis?'ON':'OFF')+' • '+(j.ytdlp||'')+'</div></div></div>'+
    '<div class="cyber-card result-card adm-sec"><div class="result-header"><span>'+esc(t('a.recent'))+'</span></div><div class="result-body">'+rows(j.recent,function(x){return '<div class="opt-row"><span class="opt-meta">'+new Date(x.t).toLocaleTimeString()+' • '+esc(x.ep)+' • '+esc(x.p)+' • '+x.ms+'ms</span><span class="q-badge">'+(x.ok?'OK':'FAIL')+'</span></div>';})+'</div></div>'+
    '<div class="cyber-card result-card adm-sec"><div class="result-header"><span>'+esc(t('a.errors'))+'</span></div><div class="result-body">'+rows(j.errors,function(x){return '<div class="opt-row"><span class="opt-meta">'+new Date(x.t).toLocaleTimeString()+' • '+esc(x.ep)+' • '+esc(x.err)+'</span></div>';})+'</div></div>';
  }catch(e){
    box.innerHTML='';
    document.getElementById('admErrTxt').textContent=e.message;
    err.classList.remove('hidden');
  }
}
async function uploadCookies(){
  var key=document.getElementById('admKey').value||(function(){try{return sessionStorage.getItem('admkey')||'';}catch(e){return '';}})();
  var f=document.getElementById('ckFile').files[0];
  var res=document.getElementById('ckUpRes');
  if(!key){res.textContent='Isi kunci admin dulu.';return;}
  if(!f){res.textContent='Pilih file cookies.txt dulu.';return;}
  res.textContent='Mengupload...';
  try{
    var txt=await f.text();
    var r=await fetch('/api/admin/cookies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,slot:document.getElementById('ckSlot').value,content:txt})});
    var j=await r.json();
    res.textContent=j.success?('OK: '+j.file+' ('+(j.files||[]).length+' file terpasang)'):('Gagal: '+(j.error||r.status));
  }catch(e){res.textContent='Gagal: '+e.message;}
}
async function checkCookies(){
  var key=document.getElementById('admKey').value||(function(){try{return sessionStorage.getItem('admkey')||'';}catch(e){return '';}})();
  if(!key) return;
  var box=document.getElementById('admBody');
  box.innerHTML='<div class="cyber-card"><div class="card-body"><p class="blink-text">CHECKING...</p></div></div>';
  try{
    var r=await fetch('/api/stats?key='+encodeURIComponent(key)+'&action=cookies');
    var j=await r.json();
    var c=j.cookiesCheck||{};
    var files=(c.files||[]).map(function(f){return '<div class="opt-row"><span class="opt-meta">'+esc(f.file)+' — '+esc(f.detail||'')+'</span><span class="q-badge">'+(f.ok?'OK':'FAIL')+'</span></div>';}).join('');
    box.innerHTML='<div class="cyber-card result-card"><div class="result-header"><span>COOKIES</span><span class="result-badge">'+(c.ok?'OK':'FAIL')+'</span></div><div class="result-body"><div class="opt-meta">'+esc(c.detail||'-')+'</div>'+files+'</div></div>';
  }catch(e){
    box.innerHTML='<div class="cyber-card error-state"><div class="error-body">'+esc(e.message)+'</div></div>';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  try{var k=sessionStorage.getItem('admkey');if(k){document.getElementById('admKey').value=k;loadStats();}}catch(e){}
  document.getElementById('admKey').addEventListener('keydown',function(e){if(e.key==='Enter')loadStats();});
});
</script>
</body>
</html>
